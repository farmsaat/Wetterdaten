# .github/workflows/daily-fetch-weather.yml
#
# Downloads daily weather data from Open-Meteo for all locations
# listed in locations.csv and commits the JSON files to the repository.
#
# Schedule: runs every day at 03:00 UTC.
# Manual trigger: Actions → "Fetch Weather Data" → Run workflow

name: Daily Fetch Weather Data

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily → 05:00 CEST
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # needed to push the JSON files back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up Python (only stdlib is used, no pip install needed)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Run the fetch script
      - name: Fetch weather JSON files
        run: python daily_fetch_weather.py

      # 4. Commit & push only if files changed
      - name: Commit and push updated weather data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_*.json
          # Only commit when something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
